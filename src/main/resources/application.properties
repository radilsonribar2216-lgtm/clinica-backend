# =========================================================
# Configuracion de conexion a la base de datos MySQL local
# Ajusta usuario y contrasena segun tu instalacion de MySQL Workbench
# =========================================================
spring.datasource.url=jdbc:mysql://localhost:3306/clinica?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=801234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# No modificar el esquema automaticamente: la BD ya existe (restaurada desde el backup .sql)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=8080
